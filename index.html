<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mother's Day Card Front Cover</title>
<style>
    body {
        margin: 0;
        background: #bd7692;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Georgia', serif;
    }

    .card {
        width: 600px;
        height: 850px;
        background: #5f4155;
        border: 2px solid #dab895;
        padding: 50px;
        box-sizing: border-box;
        position: relative;
        text-align: center;
    }

    .title {
        font-size: 42px;
        letter-spacing: 2px;
        font-weight: bold;
        margin-top: 80px;
        color: #ff65b2;
    }

    .subtitle {
        margin-top: 15px;
        font-size: 20px;
        font-style: italic;
        color: #291e1e;
    }

    .line {
        width: 60%;
        height: 1px;
        background: #e0a064;
        margin: 25px auto;
    }

    .photo-box {
        width: 220px;
        height: 220px;
        border: 2px dashed #f77a05;
        margin: 30px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .photo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .quote {
        font-size: 16px;
        margin-top: 20px;
        color: #641616;
    }

    .decor {
        position: absolute;
        font-size: 18px;
        color: #eb9d5a;
    }

    .top-left { top: 20px; left: 20px; }
    .top-right { top: 20px; right: 20px; }
    .bottom-left { bottom: 20px; left: 20px; }
    .bottom-right { bottom: 20px; right: 20px; }

</style>
</head>
<body>

<div class="card">

    <div class="decor top-left">♥</div>
    <div class="decor top-right">✿</div>
    <div class="decor bottom-left">✿</div>
    <div class="decor bottom-right">♥</div>

    <div class="title">HAPPY MOTHER’S DAY</div>

    <div class="line"></div>

    <div class="subtitle">To my Queen 👑</div>

    <div class="photo-box">
        <img src="IMG-20241210-WA0035.jpg" alt="Mother's Day Image">
    </div>

    <div class="quote">my safe place 🤍</div>

</div>

</body>
</html>
